name: Deploy Hugo site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated, config-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site-config (private, with Compose submodule)
        uses: actions/checkout@v4
        with:
          repository: gotogolang/site-config
          token: ${{ secrets.DEPLOY_TOKEN }}
          submodules: true
          path: site

      - name: Checkout site-content (public)
        uses: actions/checkout@v4
        with:
          repository: gotogolang/site-content
          path: _content-src

      - name: Place content into Hugo site
        run: cp -r _content-src/content site/

      - name: Install Hugo Extended 0.148.0
        run: |
          wget -qO hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v0.148.0/hugo_extended_0.148.0_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo

      - name: Build
        working-directory: site
        run: hugo --minify

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/public
          publish_branch: gh-pages
