version: "3.9"

# Local development stack.
# Pool-service creates sibling containers via Docker socket mount.
# EXERCISES_HOST_PATH must point to the host-absolute path of ./exercises
# (Docker daemon resolves bind mounts from the host, not from inside the container).

x-exercises-mount: &exercises-host
  type: bind
  source: ${EXERCISES_HOST_PATH:-./exercises}
  target: /exercises
  read_only: true

services:

  # --------------------------------------------------------------------------
  session-service:
    build:
      context: ./tps-backend
      dockerfile: session-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SESSION_PORT: "8081"
      JWT_SECRET:   "${JWT_SECRET:-dev-secret-change-in-production}"

  # --------------------------------------------------------------------------
  pool-service-go:
    build:
      context: ./tps-backend
      dockerfile: pool-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - *exercises-host
    environment:
      POOL_PORT:      "8082"
      PACK_ID:        "go"
      IMAGE_TAG:      "gotogolang/tps-go:v0.1.0"
      POOL_SIZE:      "3"
      EXERCISES_DIR:  "${EXERCISES_HOST_PATH:-./exercises}/go"

  # --------------------------------------------------------------------------
  gateway:
    build:
      context: ./tps-backend
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./exercises
        target: /exercises
        read_only: true
    environment:
      GATEWAY_PORT:        "8080"
      SESSION_SERVICE_URL: "http://session-service:8081"
      POOL_SERVICES:       "go=http://pool-service-go:8082"
      EXERCISES_BASE_DIR:  "/exercises"
      CORS_ORIGINS:        "${CORS_ORIGINS:-*}"
    depends_on:
      - session-service
      - pool-service-go

networks:
  default:
    name: goalgo-local
