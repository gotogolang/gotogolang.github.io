version: "3.9"

# Production stack. Pull images from GHCR:
#   docker compose pull && docker compose up -d
#
# EXERCISES_HOST_PATH — host-absolute path to the exercises directory.
# Docker daemon resolves bind mounts from the host, not from inside containers.

services:

  # --------------------------------------------------------------------------
  session-service:
    image: ghcr.io/gotogolang/session-service:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SESSION_PORT: "8081"
      JWT_SECRET:   "${JWT_SECRET}"

  # --------------------------------------------------------------------------
  pool-service-go:
    image: ghcr.io/gotogolang/pool-service:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: "${EXERCISES_HOST_PATH}"
        target: /exercises
        read_only: true
    environment:
      POOL_PORT:      "8082"
      PACK_ID:        "go"
      IMAGE_TAG:      "ghcr.io/gotogolang/tps-go:latest"
      POOL_SIZE:      "${POOL_SIZE:-3}"
      EXERCISES_DIR:  "${EXERCISES_HOST_PATH}/go"

  # --------------------------------------------------------------------------
  gateway:
    image: ghcr.io/gotogolang/gateway:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: "${EXERCISES_HOST_PATH}"
        target: /exercises
        read_only: true
    environment:
      GATEWAY_PORT:        "8080"
      SESSION_SERVICE_URL: "http://session-service:8081"
      POOL_SERVICES:       "go=http://pool-service-go:8082"
      EXERCISES_BASE_DIR:  "/exercises"
      CORS_ORIGINS:        "${CORS_ORIGINS:-https://gotogolang.github.io}"
    depends_on:
      - session-service
      - pool-service-go

networks:
  default:
    name: goalgo
